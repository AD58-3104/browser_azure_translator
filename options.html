<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原文⇄翻訳トグル 設定</title>
<style>
  :root { --ink:#1b2430; --sub:#5b6675; --line:#d7dde4; --bg:#f7f9fb; --accent:#1f5fbf; --ok:#15803d; --ng:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6ebf1; --sub:#9aa6b4; --line:#334050; --bg:#141a21; --accent:#6aa3ff; --ok:#4ade80; --ng:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font: 15px/1.75 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; }
  main { max-width: 36rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .lead { color: var(--sub); margin: 0 0 2rem; }
  label { display:block; font-weight:600; margin-top:1.25rem; }
  .hint { color: var(--sub); font-size: .85rem; font-weight: 400; }
  input[type=text], input[type=password], select { width:100%; margin-top:.35rem; padding:.55rem .7rem;
    font: inherit; color: inherit; background: transparent; border:1px solid var(--line); border-radius:4px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display:flex; gap:.6rem; align-items:flex-start; font-weight:400; }
  .check input { margin-top:.45rem; }
  .row { display:flex; gap:.75rem; margin-top:2rem; align-items:center; flex-wrap:wrap; }
  button { font: inherit; padding:.5rem 1.1rem; border-radius:4px; cursor:pointer;
    border:1px solid var(--accent); background: var(--accent); color:#fff; }
  button.plain { background: transparent; color: var(--accent); }
  #status { font-size:.9rem; }
  #status.ok { color: var(--ok); } #status.ng { color: var(--ng); }
  .usage { margin-top: 2.5rem; padding-top: 1rem; border-top:1px solid var(--line); color: var(--sub); font-size:.9rem; }
  h2 { font-size:1rem; margin:2.25rem 0 0; padding-top:1.25rem; border-top:1px solid var(--line); }
  fieldset { border:0; padding:0; margin:1.25rem 0 0; }
  legend { font-weight:600; padding:0; }
  fieldset .check { margin-top:.4rem; }
  .note { margin:.75rem 0 0; }
  code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size:.85em; }
  [hidden] { display:none !important; }
  .usage strong { color: var(--ink); font-size: 1.1rem; }
</style>
</head>
<body>
<main>
  <h1>原文⇄翻訳トグル</h1>
  <p class="lead">Alt+T（またはツールバーのボタン）で翻訳し、もう一度押すと原文に戻ります。訳文表示中は Ctrl+ホバーで原文を確認、Alt+R でマウスの下の段落を高品質モデルで再翻訳できます。ショートカットは edge://extensions/shortcuts で変更できます。</p>

  <fieldset>
    <legend>翻訳エンジン</legend>
    <label class="check"><input type="radio" name="engine" value="azure">
      <span>Azure Translator<span class="hint">　高速・高品質。無料枠は月 200 万文字</span></span></label>
    <label class="check"><input type="radio" name="engine" value="ollama">
      <span>Ollama（ローカル）<span class="hint">　無料・オフライン。PC の性能次第で遅くなります</span></span></label>
  </fieldset>

  <section id="azure-settings">
    <label for="apiKey">Azure Translator のキー
      <span class="hint">「キーとエンドポイント」にある KEY 1 または KEY 2</span></label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false">

    <label for="region">リージョン
      <span class="hint">例: koreacentral。リソースを Global で作った場合は空欄</span></label>
    <input id="region" type="text" spellcheck="false" placeholder="koreacentral">
  </section>

  <section id="ollama-settings">
    <h2>Ollama（ローカルモデル）</h2>
    <label for="ollamaUrl">Ollama の URL</label>
    <input id="ollamaUrl" type="text" spellcheck="false" placeholder="http://localhost:11434">

    <div id="ollama-main">
      <label for="ollamaModel">通常の翻訳に使うモデル
        <span class="hint">ollama list に表示される名前（例: translategemma:4b）</span></label>
      <input id="ollamaModel" type="text" spellcheck="false" placeholder="translategemma:4b">
    </div>

    <label for="ollamaModelHQ">再翻訳に使う高品質モデル
      <span class="hint">訳が怪しい段落にマウスを乗せて Alt+R を押すと、その段落だけこのモデルで訳し直します。Azure 使用時も利用できます</span></label>
    <input id="ollamaModelHQ" type="text" spellcheck="false" placeholder="translategemma:12b">

    <p class="hint note">事前に環境変数 <code>OLLAMA_ORIGINS=chrome-extension://*</code> を設定して Ollama を起動してください。詳しくは README を参照。</p>
  </section>

  <label for="target">翻訳先の言語</label>
  <select id="target">
    <option value="ja">日本語</option>
    <option value="en">英語</option>
    <option value="zh-Hans">中国語（簡体字）</option>
    <option value="zh-Hant">中国語（繁体字）</option>
    <option value="ko">韓国語</option>
  </select>

  <label class="check"><input id="hover" type="checkbox">
    <span>Ctrl を押しながらマウスを乗せると、その部分の原文を表示する</span></label>

  <div class="row">
    <button id="save">保存</button>
    <button id="test" class="plain">接続テスト</button>
    <button id="testHQ" class="plain">再翻訳モデルをテスト</button>
    <span id="status" role="status"></span>
  </div>

  <p class="usage" id="usage-block">今月送信した文字数（目安）<br><strong id="usage">–</strong>
    <span> / 無料枠 F0 は月 2,000,000 文字</span></p>
</main>
<script src="options.js"></script>
</body>
</html>
